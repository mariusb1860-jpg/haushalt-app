<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b5cab" />
    <title>Haushalt</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Haushalt</h1>
      <p id="date"></p>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>Heute</h2>
          <span id="progress"></span>
        </div>
        <ul id="today-list" class="task-list"></ul>
        <div id="all-done" class="all-done" hidden>
          <p>Alles erledigt. Feierabend!</p>
          <img id="reward-image" alt="Deine Belohnung" hidden />
        </div>
      </section>

      <section id="upcoming-section">
        <h2>Demnächst</h2>
        <ul id="upcoming-list" class="upcoming-list"></ul>
      </section>

      <details class="settings">
        <summary>Einstellungen</summary>
        <h3>Belohnungsbild</h3>
        <p class="hint">
          Erscheint, wenn alle Aufgaben des Tages abgehakt sind. Das Bild bleibt nur auf diesem
          Gerät und wird nirgends hochgeladen.
        </p>
        <img id="reward-preview" class="reward-preview" alt="Gewähltes Belohnungsbild" hidden />
        <div class="buttons">
          <label class="button">
            Bild wählen
            <input id="reward-input" type="file" accept="image/*" hidden />
          </label>
          <button id="reward-delete" type="button" class="button secondary" hidden>Bild entfernen</button>
        </div>
      </details>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
