<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b5cab" />
    <title>Haushalt</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Haushalt</h1>
      <p id="date"></p>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2>Heute</h2>
          <span id="progress"></span>
        </div>
        <ul id="today-list" class="task-list"></ul>
        <p id="all-done" class="all-done" hidden>Alles erledigt. Feierabend!</p>
      </section>

      <section id="upcoming-section">
        <h2>Demnächst</h2>
        <ul id="upcoming-list" class="upcoming-list"></ul>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
